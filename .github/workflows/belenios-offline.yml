name: Offline Belenios referendum

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/belenios-offline.yml'
      - 'citizen.py'
      - 'belenios_demo.py'
      - 'integrations/belenios/**'
      - 'tests/test_belenios_*.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-archive-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and verify the pinned Debian native executable and its libraries
        run: python3 -B integrations/belenios/prepare.py "$RUNNER_TEMP/belenios"
      - name: Prepare the isolated Linux voter
        run: command -v bwrap || (sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap)
      - name: Generate and replay the fictional elections with the network disconnected
        shell: bash
        run: |
          sudo -n unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            bash -eu -o pipefail -s -- "$RUNNER_TEMP" <<'OFFLINE'
          test "$(id -u)" -ne 0
          awk -F: 'NR>2 {gsub(/ /,"",$1); if ($1!="lo") exit 1; interfaces++} END {if(interfaces!=1) exit 1}' /proc/net/dev
          python3 -B citizen.py belenios-demo --tool "$1/belenios/belenios-tool" --public-bundle "$1/public-referenda.zip" --setup-pin "$1/public-setup.json"
          python3 -B integrations/belenios/replay.py "$1/public-referenda.zip" --tool "$1/belenios/belenios-tool"
          python3 -B citizen.py belenios-replay "$1/public-referenda.zip" --setup-pin "$1/public-setup.json" --tool "$1/belenios/belenios-tool"
          unzip -p "$1/public-referenda.zip" adopted/setup/election.bel > "$1/opening.bel"
          unzip -p "$1/public-referenda.zip" adopted/final/election.bel > "$1/closed.bel"
          pin=$(jq -er '.sha256.adopted' "$1/public-setup.json")
          reader=(python3 -B citizen.py belenios-tally "$1/opening.bel" "$1/closed.bel"
                  --setup-sha256 "$pin" --tool "$1/belenios/belenios-tool")
          "${reader[@]}" > "$1/opening-tally.json"
          jq -e '.opening_electorate == {eligible:6,jurisdiction:"sim-town",reference_at:"2026-01-01T00:00:00Z",snapshot_id:"sim-town-roll"}
                 and .public_credentials == 5 and .verified_ballots == 5 and .yes == 4 and .not_voted == 1
                 and .decision_required == 4 and .outcome == "adopted"' "$1/opening-tally.json" >/dev/null
          if "${reader[@]}" --eligible 7 >"$1/rejected.out" 2>"$1/rejected.err"; then exit 1; fi
          test ! -s "$1/rejected.out"
          grep -Fx 'eligible population differs from the pinned opening' "$1/rejected.err"
          python3 -B citizen.py belenios-demo --tool "$1/belenios/belenios-tool" --public-bundle "$1/another.zip" --setup-pin "$1/another-setup.json" >/dev/null
          python3 -B citizen.py belenios-replay "$1/another.zip" --setup-pin "$1/another-setup.json" --tool "$1/belenios/belenios-tool"
          if python3 -B citizen.py belenios-replay "$1/another.zip" --setup-pin "$1/public-setup.json" --tool "$1/belenios/belenios-tool" 2>"$1/mismatched.stderr"; then exit 1; fi
          grep -Fx 'referendum setup differs from the independently retained pin' "$1/mismatched.stderr"
          CITIZEN_TEST_ISOLATED_VOTER=sudo BELENIOS_TOOL="$1/belenios/belenios-tool" \
            python3 -B -m unittest discover -s tests -p 'test_belenios_*.py'
          OFFLINE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-public-referenda
          path: ${{ runner.temp }}/public-referenda.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-referendum-public-setup
          path: ${{ runner.temp }}/public-setup.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-opening-tally
          path: ${{ runner.temp }}/opening-tally.json
          if-no-files-found: error
